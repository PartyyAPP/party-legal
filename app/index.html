<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Descarga Party</title>
<meta name="description" content="Descarga Party gratis en el App Store o en Google Play y mira qué abre esta noche.">
<meta name="theme-color" content="#07050d">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://partyyapp.com/app/">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta property="og:title" content="Party · ¿Qué abre esta noche?">
<meta property="og:description" content="Discotecas y pubs con horario de hoy, música, edad y cómo llegar. Gratis en iPhone y Android.">
<meta property="og:image" content="https://partyyapp.com/assets/img/og-2.jpg">
<style>
  @font-face{font-family:"Unbounded";src:url("../assets/fonts/unbounded-latin.woff2") format("woff2");font-weight:400 900;font-display:swap}
  @font-face{font-family:"DM Sans";src:url("../assets/fonts/dmsans-latin.woff2") format("woff2");font-weight:400 700;font-display:swap}
  :root{--night:#07050d;--fg:#f2f0f7;--muted:#a7a3b3;--accent:#780ff0}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--night);color:var(--fg);font-family:"DM Sans",system-ui,sans-serif}
  body{min-height:100svh;display:grid;place-items:center;padding:32px 16px;
    background:radial-gradient(60% 45% at 50% 0%,rgba(120,15,240,.38),transparent 70%),radial-gradient(50% 40% at 50% 100%,rgba(120,15,240,.22),transparent 70%),var(--night)}
  main{width:100%;max-width:420px;text-align:center}
  .icon{width:112px;height:112px;border-radius:26px;box-shadow:0 20px 60px rgba(120,15,240,.55);display:block;margin:0 auto 22px}
  h1{font-family:"Unbounded",sans-serif;font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1.05;margin:0 0 12px;letter-spacing:-.01em}
  p{color:var(--muted);font-size:17px;line-height:1.45;margin:0 0 28px}
  .btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:17px 20px;border-radius:16px;
    font-weight:700;font-size:17px;text-decoration:none;color:#fff;background:#6e0fdb;margin-bottom:12px;box-shadow:0 10px 30px rgba(110,15,219,.45)}
  .btn.alt{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid rgba(255,255,255,.14)}
  .btn svg{width:22px;height:22px;flex:none}
  .status{font-size:14px;color:var(--muted);margin-top:18px;min-height:20px}
  .home{display:inline-block;margin-top:26px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <img class="icon" src="../apple-touch-icon.png" alt="" width="112" height="112">
  <h1 id="t">¿Qué abre esta noche?</h1>
  <p id="d">Discotecas y pubs con el horario de hoy, música, edad y cómo llegar. Gratis y sin anuncios.</p>
  <a class="btn" id="ios" href="https://apps.apple.com/es/app/id6827253251">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1zM13.9 5c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>
    <span id="iosL">Descargar en el App Store</span></a>
  <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=com.partyyapp.app">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.3c-.2.2-.3.6-.3 1v17.4c0 .4.1.8.3 1l9.7-9.7-9.7-9.7zm10.8 10.8 2.7 2.7-11 6.3 8.3-9zm0-2.2L6.1 1.9l11 6.3-2.7 2.7zm3.9-1.6 3 1.7c.9.5.9 1.5 0 2l-3 1.7-3-2.7 3-2.7z"/></svg>
    <span id="andL">Descargar en Google Play</span></a>
  <div class="status" id="s"></div>
  <a class="home" href="../" id="h">partyyapp.com</a>
</main>
<script>
  // Sends phones straight to their store. ?s=<source> (cartel, pegatina, erasmus...) goes to Google Play as utm_source.
  (function () {
    var q = new URLSearchParams(location.search), src = (q.get("s") || "web").replace(/[^a-z0-9_-]/gi, "").slice(0, 30);
    var en = !/^es\b/i.test(navigator.language || "es");
    var ios = "https://apps.apple.com/" + (en ? "gb" : "es") + "/app/id6827253251";
    var play = "https://play.google.com/store/apps/details?id=com.partyyapp.app&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_medium=qr");
    document.getElementById("ios").href = ios;
    document.getElementById("android").href = play;
    if (en) {
      document.documentElement.lang = "en";
      document.title = "Download Party";
      document.getElementById("t").textContent = "What's open tonight?";
      document.getElementById("d").textContent = "Clubs and bars with today's hours, music, age and directions. Free, no ads.";
      document.getElementById("iosL").textContent = "Download on the App Store";
      document.getElementById("andL").textContent = "Get it on Google Play";
    }
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    var to = isIOS ? ios : isAndroid ? play : null;
    if (to) {
      document.getElementById("s").textContent = en ? "Opening the store…" : "Abriendo la tienda…";
      location.replace(to);
    }
  })();
</script>
</body>
</html>
